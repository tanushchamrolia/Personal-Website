<style>
/* Layout: a single-page React app with a fixed top bar and five separate pages

:root {

* { box-sizing: border-box; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */

<script>

/* ---------------- routing ---------------- */
function useRoute() {
  const valid = id => PAGES.some(p => p.id === id);
  const read = () => { const h = (location.hash || "").replace("#", ""); return valid(h) ? h : "home"; };
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => setRoute(read());
    addEventListener("hashchange", on);
    return () => removeEventListener("hashchange", on);
  }, []);
  const go = id => {
    setRoute(id);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  };
  return [route, go];
}

/* ---------------- pieces ---------------- */
function Badge({ kind, children }) { return html`<span class=${"badge" + (kind ? " " + kind : "")}>${children}</span>`; }
function Bullets({ items }) { return html`<ul class="bullets">${items.map((t, i) => html`<li key=${i}>${t}</li>`)}</ul>`; }
function Ext({ href, children }) { return html`<a class="textlink" href=${href} target="_blank" rel="noopener">${children} ↗</a>`; }
function Label({ children }) { return html`<div class="section-label">${children}</div>`; }
function PageHead({ eyebrow, title, intro }) {
  return html`<div class="head"><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1>${intro && html`<p class="page-intro">${intro}</p>`}</div>`;
}

/* knight's tour canvas */
function KnightsTour({ compact }) {
  const ref = useRef(null);
  const [state, setState] = useState({ sq: "a1", move: 1 });
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext("2d");
    const N = 8, S = cv.width / N;
    const css = getComputedStyle(document.documentElement);
    const C = k => css.getPropertyValue(k).trim();
    const ROYAL = C("--royal"), SOFT = C("--royal-soft"), PAPER = C("--paper"), INK = C("--ink"), SURF = C("--surface-2");
    const K = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
    function tour(sx, sy) {
      const seen = Array.from({ length: N }, () => Array(N).fill(false));
      const ok = (x, y) => x >= 0 && y >= 0 && x < N && y < N && !seen[y][x];
      const deg = (x, y) => K.filter(([dx, dy]) => ok(x + dx, y + dy)).length;
      let x = sx, y = sy; const path = [[x, y]]; seen[y][x] = true;
      for (let i = 1; i < 64; i++) {
        let best = null, bd = 9;
        for (const [dx, dy] of K) { const nx = x + dx, ny = y + dy; if (ok(nx, ny)) { const d = deg(nx, ny); if (d < bd) { bd = d; best = [nx, ny]; } } }
        if (!best) return null;
        [x, y] = best; seen[y][x] = true; path.push(best);
      }
      return path;
    }
    let path = null;
    for (let s = 0; s < 64 && !path; s++) path = tour(s % 8, Math.floor(s / 8));
    if (!path) return;
    const ctr = ([x, y]) => [x * S + S / 2, (N - 1 - y) * S + S / 2];
    const name = ([x, y]) => "abcdefgh"[x] + (y + 1);
    let last = -1;
    function draw(p) {
      const full = Math.floor(p), frac = p - full;
      ctx.fillStyle = INK; ctx.fillRect(0, 0, cv.width, cv.height);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if ((x + y) % 2) { ctx.fillStyle = SURF; ctx.fillRect(x * S, y * S, S, S); }
      for (let i = 0; i <= full && i < 64; i++) {
        const [x, y] = path[i]; ctx.fillStyle = "rgba(125,69,245," + (0.08 + 0.22 * i / 63) + ")";
        ctx.fillRect(x * S + 5, (N - 1 - y) * S + 5, S - 10, S - 10);
      }
      ctx.lineWidth = 3.5; ctx.lineJoin = "round"; ctx.strokeStyle = ROYAL; ctx.beginPath();
      for (let i = 0; i <= full && i < 64; i++) { const [cx, cy] = ctr(path[i]); i ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy); }
      let head = ctr(path[Math.min(full, 63)]);
      if (full < 63) { const a = ctr(path[full]), b = ctr(path[full + 1]); head = [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac]; ctx.lineTo(head[0], head[1]); }
      ctx.stroke();
      for (let i = 0; i <= full && i < 64; i++) { const [cx, cy] = ctr(path[i]); ctx.fillStyle = SOFT; ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill(); }
      ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(head[0], head[1], 13, 0, 7); ctx.fill();
      ctx.fillStyle = INK; ctx.font = "600 18px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("♞", head[0], head[1] + 1);
      const idx = Math.min(full, 63);
      if (idx !== last) { last = idx; setState({ sq: name(path[idx]), move: idx + 1 }); }
    }
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(63); return; }
    const SPEED = 3.5; let t0 = null, raf;
    const loop = ts => {
      if (t0 === null) t0 = ts - (24 / SPEED) * 1000;
      let p = (ts - t0) / 1000 * SPEED;
      if (p > 63 + SPEED * 3) { t0 = ts; p = 0; }
      draw(Math.min(p, 63)); raf = requestAnimationFrame(loop);
    };
    draw(24); raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);
  if (compact) return html`<figure class="board" style=${{ margin: 0 }}><canvas ref=${ref} width="480" height="480" aria-label="Animated knight's tour"></canvas></figure>`;
  return html`<figure class="board" style=${{ margin: 0 }}>
    <canvas ref=${ref} width="800" height="800" aria-label="Animated knight's tour: a chess knight visiting all 64 squares once"></canvas>
    <figcaption class="board-cap"><span>Knight's tour · Warnsdorff's rule</span><span><b>${state.sq}</b> · move <b>${state.move}</b>/64</span></figcaption>
  </figure>`;
}

function Gallery() {
  const [open, setOpen] = useState(null);
  useEffect(() => {
    if (open === null) return;
    const on = e => {
      if (e.key === "Escape") setOpen(null);
      if (e.key === "ArrowRight") setOpen(i => (i + 1) % PHOTOS.length);
      if (e.key === "ArrowLeft") setOpen(i => (i + PHOTOS.length - 1) % PHOTOS.length);
    };
    addEventListener("keydown", on);
    return () => removeEventListener("keydown", on);
  }, [open]);
  return html`
    <div class="photos" aria-label="Conference photos">
      ${PHOTOS.map((p, i) => html`
        <button key=${i} class=${"photo" + (i === 0 ? " lead" : "")} onClick=${() => setOpen(i)} aria-label=${"Enlarge photo: " + p.cap}>
          <figure style=${{ margin: 0, height: "100%" }}><img src=${p.src} alt=${p.alt} loading="lazy" /><figcaption>${p.cap}</figcaption></figure>
        </button>`)}
    </div>
    ${open !== null && html`
      <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" onClick=${e => { if (e.target === e.currentTarget) setOpen(null); }}>
        <img src=${PHOTOS[open].src} alt=${PHOTOS[open].alt} />
        <p>${PHOTOS[open].cap} · ${open + 1} of ${PHOTOS.length}</p>
        <div class="lb-controls">
          <button onClick=${() => setOpen((open + PHOTOS.length - 1) % PHOTOS.length)}>← Previous</button>
          <button onClick=${() => setOpen(null)} autoFocus>Close</button>
          <button onClick=${() => setOpen((open + 1) % PHOTOS.length)}>Next →</button>
        </div>
      </div>`}
  `;
}

function useChess() {
  const [data, setData] = useState({ ...CHESS_SNAPSHOT, live: false });
  useEffect(() => {
    let alive = true;
    // Works when the site is hosted somewhere that can reach chess.com (e.g. GitHub Pages).
    fetch("https://api.chess.com/pub/player/" + CHESS_USER + "/stats")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(j => {
        if (!alive) return;
        const pick = (k, fb) => j[k] && j[k].last ? { rating: j[k].last.rating, delta: null } : fb;
        setData({
          date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
          rapid: pick("chess_rapid", CHESS_SNAPSHOT.rapid),
          blitz: pick("chess_blitz", CHESS_SNAPSHOT.blitz),
          bullet: pick("chess_bullet", CHESS_SNAPSHOT.bullet),
          puzzles: CHESS_SNAPSHOT.puzzles,
          live: true,
        });
      })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  return data;
}

function Rating({ label, r }) {
  const pct = Math.max(4, Math.min(100, (r.rating / 2000) * 100));
  return html`<div class="rating">
    <small>${label}</small>
    <div class="num">${r.rating.toLocaleString()}</div>
    ${r.delta != null && html`<span class=${"delta " + (r.delta >= 0 ? "up" : "down")}>${r.delta >= 0 ? "▲ +" : "▼ "}${r.delta}</span>`}
    <div class="bar-track" title="Scale 0–2000"><div class="bar-fill" style=${{ width: pct + "%" }}></div></div>
  </div>`;
}
